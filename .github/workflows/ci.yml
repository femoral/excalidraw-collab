# CI: typecheck, test, build, then publish the multi-arch container image to GHCR.
#
# Triggers: push to main, and git tags matching v* (semver releases).
#
# Image: ghcr.io/<owner>/<repo>  (e.g. ghcr.io/femoral/excalidraw-collab)
#
# Tags (GitOps should pin the SHA tag — `latest` is convenience only):
#   sha-<7-char-short-sha>   always (immutable pin; format used by deploy/#33)
#   latest                   only on the default branch (main)
#   <version>, <major.minor>, <major>
#                            only on v* tags (v1.2.3 → 1.2.3, 1.2, 1)
#
# Auth: GITHUB_TOKEN with packages:write. No registry credentials in the repo.
# Layer cache: GitHub Actions cache (type=gha) so source-only changes skip
# reinstalling the pnpm store when BuildKit cache mounts are warm.

name: ci

on:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names; github.repository is already lower for us.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # packageManager in package.json selects the pnpm version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm exec tsc -b --pretty false
          pnpm --filter @excalidraw-collab/web exec tsc -p tsconfig.json --noEmit

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  image:
    name: build, push, and smoke the container image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Prefer OCI labels; keep the SHA tag format stable for GitOps.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=excalidraw-collab
            org.opencontainers.image.description=Self-hosted Excalidraw with server-side persistence and turn-based collaboration

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA cache restores previous build layers (including BuildKit cache
          # mounts used for the pnpm store in the Dockerfile).
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Resolve SHA image tag for smoke
        id: smoke_tag
        run: |
          short="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          image="${REGISTRY}/${IMAGE_NAME}:sha-${short}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "Smoke target image: ${image}"

      - name: Smoke-test published image
        run: .github/scripts/smoke-image.sh "${{ steps.smoke_tag.outputs.image }}"
