<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>excalidraw-collab</title>
    <!--
      Apply a provisional theme before CSS/JS paint so there is no light flash.
      Uses localStorage only (instance default arrives later via API); when no
      local choice exists, follow prefers-color-scheme. React re-applies once
      the instance default is known.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("excalidraw-collab.theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* private mode / blocked storage — CSS defaults to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
